# Per-flight settings. A flight that is not listed under `flights` uses `defaults`;
# a listed flight only needs the settings that differ from them.
#
# yaw_offset    [deg] Rotates the OptiTrack rigid-body frame so that x (red arrow)
#               points forward. Positive = counter-clockwise seen from above.
# wing_markers  Marker on each wing used as reference point for the dihedral angle.

defaults:
  yaw_offset: 0
  wing_markers: {left: 3, right: 2}

flights:
  flight_001:
    yaw_offset: 90
    wing_markers: {left: 3, right: 1}
  flight_002:
    yaw_offset: 90
    wing_markers: {left: 3, right: 1}
